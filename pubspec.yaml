name: gp1
description: "Hệ thống quản trị doanh nghiệp GP1"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  chewie: ^1.14.1
  collection: ^1.19.1
  crypto: ^3.0.7
  dio: ^5.9.2
  file_picker: ^12.0.0-beta.7
  file_saver: ^0.4.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_gen: ^5.14.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  go_table:
    git:
      url: https://github.com/dgtoan/go_table.git
      ref: v1.1.2
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  loading_animation_widget: ^1.3.0
  mime: ^2.0.0
  package_info_plus: ^10.1.0
  pdfrx: ^2.4.4
  photo_view: ^0.15.0
  pretty_qr_code: ^3.6.0
  retrofit: ^4.9.2
  shared_preferences: ^2.5.5
  solar_icons: ^0.1.0
  talker_dio_logger: ^5.1.17
  talker_flutter: ^5.1.17
  url_launcher: ^6.3.2
  video_player: ^2.13.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.6
  swagger_parser: ^1.43.1

flutter:
  uses-material-design: true

  assets:
    - assets/colors/colors.xml
    - assets/images/

flutter_gen:
  output: lib/generated

  integrations:
    image: true
    flutter_svg: true

  colors:
    inputs:
      - assets/colors/colors.xml

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo_kaizen_go.png"

  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_kaizen_go.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_icon.png
